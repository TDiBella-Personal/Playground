<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Social Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="midnight">
  <div id="splash-bg">
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="wave wave-3"></div>
  </div>

  <div id="app" class="centered">
    <header>
      <div class="header-row">
        <h1 id="logo">Social Search</h1>
        <button id="settings-btn" type="button" title="Settings" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <p class="subtitle">Search across 12 platforms at once</p>
    </header>

    <form id="search-form">
      <div class="search-bar">
        <input type="text" id="query" placeholder="Search any topic, person, or event..." autocomplete="off" autofocus>
        <button type="submit" id="search-btn">Search</button>
      </div>
    </form>

    <div id="toolbar" class="hidden">
      <div id="filters">
        <button class="filter active" data-platform="hackernews" type="button">Hacker News</button>
        <button class="filter active" data-platform="reddit" type="button">Reddit</button>
        <button class="filter active" data-platform="youtube" type="button">YouTube</button>
        <button class="filter active" data-platform="devto" type="button">Dev.to</button>
        <button class="filter active" data-platform="github" type="button">GitHub</button>
        <button class="filter active" data-platform="stackoverflow" type="button">Stack&shy;Overflow</button>
        <button class="filter active" data-platform="wikipedia" type="button">Wikipedia</button>
        <button class="filter active" data-platform="lemmy" type="button">Lemmy</button>
        <button class="filter active" data-platform="googlenews" type="button">Google News</button>
        <button class="filter active" data-platform="archiveorg" type="button">Archive.org</button>
        <button class="filter active" data-platform="arxiv" type="button">ArXiv</button>
        <button class="filter active" data-platform="mastodon" type="button">Mastodon</button>
      </div>
      <div id="count-control">
        <button id="count-minus" type="button" aria-label="Fewer results">&minus;</button>
        <span id="count-display">10</span>
        <button id="count-plus" type="button" aria-label="More results">&plus;</button>
      </div>
    </div>

    <div id="status" class="hidden"></div>
    <div id="results"></div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="close-settings-x" class="close-x" type="button" aria-label="Close">&times;</button>
      </div>

      <div class="settings-section">
        <h3>Theme</h3>
        <div id="theme-picker" class="theme-picker">
          <button class="theme-swatch" data-theme="midnight" type="button" title="Midnight">
            <span class="swatch-colors"><span style="background:#101820"></span><span style="background:#7aaddb"></span><span style="background:#b8a0d4"></span><span style="background:#3a7a5c"></span></span>
            <span class="swatch-name">Midnight</span>
          </button>
          <button class="theme-swatch" data-theme="ember" type="button" title="Ember">
            <span class="swatch-colors"><span style="background:#1a1614"></span><span style="background:#d4945e"></span><span style="background:#c46a42"></span><span style="background:#b05a30"></span></span>
            <span class="swatch-name">Ember</span>
          </button>
          <button class="theme-swatch" data-theme="forest" type="button" title="Forest">
            <span class="swatch-colors"><span style="background:#101a16"></span><span style="background:#5cb88a"></span><span style="background:#4aa888"></span><span style="background:#8ab060"></span></span>
            <span class="swatch-name">Forest</span>
          </button>
          <button class="theme-swatch" data-theme="amethyst" type="button" title="Amethyst">
            <span class="swatch-colors"><span style="background:#15101e"></span><span style="background:#9590d0"></span><span style="background:#d08a9e"></span><span style="background:#6858b0"></span></span>
            <span class="swatch-name">Amethyst</span>
          </button>
          <button class="theme-swatch" data-theme="slate" type="button" title="Slate">
            <span class="swatch-colors"><span style="background:#181a28"></span><span style="background:#50b8ba"></span><span style="background:#c0cad6"></span><span style="background:#4e5a6a"></span></span>
            <span class="swatch-name">Slate</span>
          </button>
        </div>
      </div>

      <div class="settings-section">
        <h3>YouTube API Key <span class="optional">(optional)</span></h3>
        <input type="text" id="yt-key" placeholder="Enter your YouTube Data API v3 key">
        <p class="hint">Get a free key from <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">Google Cloud Console</a>. Enable "YouTube Data API v3" first.</p>
      </div>

      <div class="modal-actions">
        <button id="save-settings" type="button">Save</button>
        <button id="close-settings" type="button" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
