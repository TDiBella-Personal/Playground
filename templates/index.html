{% extends "base.html" %}

{% block title %}Social Search{% endblock %}

{% block content %}
<div class="home">
    <h1 class="logo">Social Search</h1>
    <p class="tagline">Search Reddit, YouTube, and Hacker News in one place</p>
    <form action="/search" method="get" class="search-form">
        <input type="text" name="q" placeholder="Search for a topic, person, event..." autofocus autocomplete="off">
        <button type="submit">Search</button>
    </form>
</div>
{% endblock %}
